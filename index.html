<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daniel, do you love me?</title>

<!-- home screen app -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#120a10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="For Daniel" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Courier+Prime:wght@400;700&family=Old+Standard+TT:wght@700&family=Playfair+Display:wght@900&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #120a10;
    --paper: #f3e6d3;
    --blush: #e9a3bd;
    --rose: #c8325a;
    --wine: #5a1230;
    --glass: rgba(255, 210, 235, 0.55);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, #2a1020 0%, var(--ink) 65%);
    font-family: "Special Elite", "Courier New", monospace;
    color: var(--paper);
    overflow-x: hidden;
  }
  /* film grain */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* jewel-case frame */
  .case {
    position: relative; width: min(94vw, 470px); margin: 24px 0;
    padding: 44px 26px 34px; min-height: 710px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    border: 2px solid var(--glass); border-radius: 12px;
    background:
      radial-gradient(circle at 50% 52%, transparent 0 34px, rgba(255,255,255,.08) 35px 36px, transparent 37px 120px, rgba(255,255,255,.07) 121px 122px, transparent 123px),
      rgba(30, 12, 24, .7);
    box-shadow: 0 0 0 6px rgba(255,210,235,.08), 0 30px 80px rgba(0,0,0,.6), inset 0 0 40px rgba(233,163,189,.12);
    overflow: hidden;
  }
  .case::before { /* hinge ticks */
    content: ""; position: absolute; left: 10px; top: 14px; bottom: 14px; width: 6px;
    background: repeating-linear-gradient(to bottom, var(--glass) 0 2px, transparent 2px 14px); opacity: .6;
  }

  /* collage pieces */
  .piece { position: absolute; }
  .stamp {
    top: 14px; right: 14px; width: 108px; height: 128px; transform: rotate(5deg); z-index: 5;
    background: #f2b7ae; padding: 12px 10px; color: var(--wine); text-align: center;
    font-size: 11px; line-height: 1.1;
  }
  .stamp { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .stamp::before { content: ""; position: absolute; inset: 0; border: 6px dotted #1e0c18; }
  .stamp path { transition: fill .4s ease; }
  .stamp svg { transition: filter .4s ease; }
  .stamp.hot path { fill: #ff2d55; }
  .stamp.hot svg { filter: drop-shadow(0 0 6px rgba(255,45,85,.85)); }
  .stamp.zap { animation: stampZap .65s ease; }
  @keyframes stampZap {
    0%   { transform: rotate(5deg) scale(1); }
    20%  { transform: rotate(-8deg) scale(1.2); }
    40%  { transform: rotate(12deg) scale(1.12); }
    60%  { transform: rotate(-4deg) scale(1.15); }
    100% { transform: rotate(5deg) scale(1); }
  }
  .stamp svg { width: 40px; height: 40px; display: block; margin: 4px auto 8px; }
  .stamp-msg { font-size: 13px; line-height: 1.3; font-weight: 700; }
  .tag {
    left: 22px; top: 22px; background: var(--paper); color: var(--ink); padding: 6px 12px;
    font-size: 12px; transform: rotate(-6deg); border-radius: 2px;
  }

  /* tape */
  .tape {
    position: absolute; width: 54px; height: 17px; z-index: 7; pointer-events: none;
    background: rgba(243,230,211,.74);
    clip-path: polygon(0 0, 4% 15%, 0 30%, 4% 45%, 0 60%, 4% 75%, 0 100%, 100% 100%, 96% 85%, 100% 70%, 96% 55%, 100% 40%, 96% 25%, 100% 10%, 100% 0);
  }
  .ref.c::before { content: ""; position: absolute; left: 50%; top: -9px; width: 46px; height: 16px; margin-left: -23px; transform: rotate(4deg);
    background: rgba(243,230,211,.74); }

  /* ransom-note headline */
  .stage { position: relative; z-index: 2; text-align: center; margin-top: 112px; }
  .line { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin-bottom: 10px; }
  .word { display: inline-flex; gap: 3px; white-space: nowrap; }
  .line.big { margin-bottom: 14px; }
  .l {
    display: inline-block; padding: 2px 8px 0; line-height: 1.15;
    font-size: 38px; box-shadow: 2px 3px 6px rgba(0,0,0,.45);
  }
  .line.big .l { font-size: 52px; padding: 2px 10px 0; }
  .l.sp { background: none !important; box-shadow: none; width: 14px; padding: 0; }

  /* buttons */
  .buttons { position: relative; height: 96px; margin-top: 26px; z-index: 3; }
  button {
    position: absolute; top: 18px; border: none; cursor: pointer;
    font-family: "Special Elite", monospace; font-size: 18px; padding: 12px 30px;
    transition: transform .2s ease; box-shadow: 3px 5px 10px rgba(0,0,0,.5);
  }
  button:focus-visible { outline: 2px solid var(--blush); outline-offset: 4px; }
  #yes { left: 14%; background: var(--rose); color: #fff2f5; transform: rotate(-3deg); }
  #yes:hover { transform: rotate(-1deg) scale(1.06); }
  #no { left: 56%; background: var(--paper); color: #5a4a4a; transform: rotate(3deg); z-index: 20; transition: left .25s ease, top .25s ease, transform .2s; }
  #no.fly { position: fixed; }


  /* little postage scraps (phrases live in SWEET / SPICY below; positions are randomized in JS) */
  .refs { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 230px; z-index: 1; pointer-events: none; }
  .ref { position: absolute; width: clamp(118px, 34%, 165px); padding: 12px 12px 14px; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; transform: rotate(var(--r, 0deg)); box-shadow: 2px 4px 8px rgba(0,0,0,.5);
    pointer-events: auto; cursor: pointer; transition: transform .25s cubic-bezier(.2, 1.4, .4, 1), box-shadow .25s ease; }
  .ref:hover, .ref.up { z-index: 20 !important; transform: rotate(0deg) scale(1.12); box-shadow: 5px 12px 20px rgba(0,0,0,.65); }
  .ref.long { font-size: 10.5px; }
  .ref.a { background: #ecd3b4; color: #5d4332;
    clip-path: polygon(0 4%, 8% 0, 20% 4%, 35% 0, 52% 4%, 70% 0, 86% 4%, 100% 1%, 99% 50%, 100% 97%, 82% 100%, 60% 96%, 40% 100%, 18% 96%, 0 100%, 1% 50%); }
  .ref.b { background: var(--blush); color: var(--wine); border-radius: 2px; }
  .ref.b::before { content: ""; position: absolute; left: 50%; top: -9px; width: 46px; height: 16px; margin-left: -23px; background: rgba(243,230,211,.7); transform: rotate(-3deg); }
  .ref.c { background: var(--ink); color: var(--paper); border: 1px solid var(--blush); }
  .done .refs { display: none; }

  /* scraps slap in, and get swept away on swap */
  .ref.in { animation: scrapIn .6s var(--d, 0ms) cubic-bezier(.2, 1.5, .4, 1) backwards; }
  @keyframes scrapIn {
    from { transform: translateY(80px) scale(.3) rotate(calc(var(--r, 0deg) + 35deg)); opacity: 0; }
    to   { transform: translateY(0) scale(1) rotate(var(--r, 0deg)); opacity: 1; }
  }
  .refs.leaving, .refs.leaving .ref { pointer-events: none; }
  .refs.leaving .ref { animation: scrapOut .5s var(--d, 0ms) cubic-bezier(.5, 0, .9, .4) forwards; }
  @keyframes scrapOut {
    to { transform: translate(var(--dx, 0px), var(--dy, 220px)) rotate(calc(var(--r, 0deg) + var(--spin, 40deg))) scale(.5); opacity: 0; }
  }

  /* burst bits from the stamp */
  .puff { position: fixed; pointer-events: none; z-index: 60; line-height: 1; }

  /* cutout pops up */
  .me { display: none; position: absolute; z-index: 4; left: 46%; bottom: -4px; width: auto; height: auto; max-height: 310px; max-width: 90%; transform: translateX(-50%); filter: drop-shadow(0 8px 14px rgba(0,0,0,.6)); }
  .done .me { display: block; animation: pop .7s .25s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes pop { from { transform: translate(-50%, 105%) rotate(-6deg); } to { transform: translate(-50%, 0) rotate(0); } }

  /* cat in the corner */
  .cat { display: none; position: absolute; z-index: 6; right: 10px; bottom: 10px; width: 92px; height: auto; transform: rotate(-4deg); filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .done .cat { display: block; animation: slap .45s .9s cubic-bezier(.2, 1.6, .4, 1) both; }

  /* reply state */
  .reply { display: none; position: relative; z-index: 5; text-align: center; margin-top: 112px; }
  .reply .note {
    display: inline-block; margin-top: 20px; padding: 12px 18px; background: var(--paper); color: var(--wine);
    transform: rotate(-2deg); box-shadow: 3px 5px 10px rgba(0,0,0,.5); font-size: 15px;
  }
  .done .stage, .done .buttons { display: none; }
  .done .reply { display: block; animation: slap .45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes slap { from { transform: scale(1.5) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* falling paper bits */
  .bit { position: fixed; top: -40px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

  @media (max-width: 420px) {
    .l { font-size: 32px; } .line.big .l { font-size: 44px; }
    .stamp { width: 96px; height: 118px; } .stamp-msg { font-size: 11.5px; }
    .ref { font-size: 11px; padding: 9px 9px 11px; } .ref.long { font-size: 10px; }
    .refs { height: 215px; }
    .cat { width: 76px; }
  }
  @media (prefers-reduced-motion: reduce) { .bit, .puff { display: none; } .ref.in, .refs.leaving .ref, .stamp.zap { animation: none; } .done .reply, .done .me, .done .cat { animation: none; } }
</style>
</head>
<body>
  <main class="case" id="case">
    <div class="piece tag">for Daniel</div>

    <div class="piece stamp" aria-hidden="true">
      <span class="tape" style="top:-6px; left:-18px; transform:rotate(-38deg);"></span>
      <span class="tape" style="bottom:-4px; right:-18px; transform:rotate(-38deg);"></span>
      <svg viewBox="0 0 24 24"><path fill="#c8325a" d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></svg>
      <div class="stamp-msg" id="stampMsg">I miss you,<br>I'll see you soon</div>
    </div>

    <section class="stage">
      <div class="line" data-ransom="Daniel,"></div>
      <div class="line big" data-ransom="do you"></div>
      <div class="line big" data-ransom="love me?"></div>
    </section>

    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>

    <section class="reply" aria-live="polite">
      <div class="line big" data-ransom="WOOO"></div>
      <div class="line" data-ransom="I love you too."></div>
    </section>

    <img class="me" alt="" src="me.webp" />
    <img class="cat" alt="" src="cat.gif" />
  </main>

<script>
  /* ---- edit these ---- */
  const BITS = ["#c8325a", "#e9a3bd", "#f3e6d3", "#8c1d3f", "#f2b7ae"];


  /* ---- random photo (add more file names here) ---- */
  const PHOTOS = ["me.webp", "me2.webp", "me3.webp", "wink.webp", "glasses.webp", "tongue.webp", "warm.webp", "faire_cutout.webp", "earbuds.webp", "jacket.webp"];

  document.querySelector(".me").src = PHOTOS[Math.floor(Math.random() * PHOTOS.length)];

  /* ---- stamp message changes with the time of day (uses his device's clock) ---- */
  const STAMP_MSGS = {
    morning: ["good morning, handsome", "rise and shine, handsome"],      /* 5am - 11am */
    day:     ["I miss you, I'll see you soon", "thinking of you"],         /* 11am - 5pm */
    evening: ["hope your day was good", "good evening, handsome"],         /* 5pm - 10pm */
    night:   ["go to sleep, I love you", "goodnight, handsome"],           /* 10pm - 5am */
  };
  const stampMsgEl = document.getElementById("stampMsg");
  let stampSlotNow = null;
  function updateStampMsg() {
    const h = new Date().getHours();
    const slot = h >= 5 && h < 11 ? "morning" : h >= 11 && h < 17 ? "day" : h >= 17 && h < 22 ? "evening" : "night";
    if (slot === stampSlotNow) return;               /* same part of the day: leave it alone */
    stampSlotNow = slot;
    const list = STAMP_MSGS[slot];
    stampMsgEl.textContent = list[Math.floor(Math.random() * list.length)];
  }
  updateStampMsg();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) updateStampMsg(); });   /* app left open all day */

  /* ---- postage scraps: 3 random phrases from the active list each time ---- */
  const SWEET = [
    "I may not see you everyday but i love you everyday",
    "I will always be grateful to have you in my life",
    "your face is so kissable",
    "iloveyou iloveyou iloveyou",
    "thankyou for making me smile everyday",
  ];
  const SPICY = [
    "Pipe down handsome, you might get cracked.",
    "Congrats on your big penis!",
    "May I bounce on it, perchance.",
    "I'm not a waitress but ill take your tip",
    "dont be hard on yourself, be hard in me instead.",
    "calling me pretty gets you head btw",
  ];

  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  let scraps = null;
  function renderScraps(list, animate) {
    scraps = document.createElement("div");
    scraps.className = "refs";
    /* two scraps up top (left + right) and one lower in the middle, so none cover each other */
    const slots = shuffle([{ l: 2, b: 114 }, { l: 62, b: 118 }, { l: 32, b: 6 }]);
    const looks = shuffle(["a", "b", "c"]);      /* paper styles, shuffled */
    shuffle([...list]).slice(0, 3).forEach((text, i) => {
      const d = document.createElement("div");
      d.className = "ref " + looks[i] + (text.length > 42 ? " long" : "") + (animate ? " in" : "");
      d.textContent = text;
      d.style.left = slots[i].l + Math.random() * 4 - 2 + "%";
      d.style.bottom = slots[i].b + Math.random() * 10 + "px";
      d.style.setProperty("--r", (Math.random() * 12 - 6).toFixed(1) + "deg");
      d.style.setProperty("--d", (i * 90) + "ms");
      d.style.zIndex = 1 + Math.floor(Math.random() * 3);
      d.addEventListener("click", () => {        /* tap/click also brings a scrap to the front (for phones) */
        scraps.querySelectorAll(".up").forEach(x => { if (x !== d) x.classList.remove("up"); });
        d.classList.toggle("up");
      });
      scraps.appendChild(d);
    });
    document.getElementById("case").appendChild(scraps);
  }
  renderScraps(SWEET, false);

  /* ---- little burst of paper bits + hearts ---- */
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y) {
    if (reduceMotion) return;
    for (let i = 0; i < 24; i++) {
      const p = document.createElement("div");
      p.className = "puff";
      const color = BITS[i % BITS.length];
      if (i % 3 === 0) {
        p.textContent = "\u2665";
        p.style.color = color;
        p.style.fontSize = 14 + Math.random() * 12 + "px";
      } else {
        const w = 8 + Math.random() * 10;
        p.style.width = w + "px";
        p.style.height = w * (0.6 + Math.random() * 0.8) + "px";
        p.style.background = color;
        p.style.clipPath = "polygon(0 8%,40% 0,100% 12%,92% 100%,50% 88%,6% 100%)";
      }
      p.style.left = x + "px";
      p.style.top = y + "px";
      document.body.appendChild(p);
      const a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 120;
      const dx = Math.cos(a) * r, dy = Math.sin(a) * r;
      const spin = Math.random() * 540 - 270;
      p.animate([
        { transform: "translate(-50%,-50%) scale(.2) rotate(0deg)", opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${spin * 0.7}deg)`, opacity: 1, offset: 0.65 },
        { transform: `translate(calc(-50% + ${dx * 1.15}px), calc(-50% + ${dy * 1.15 + 40}px)) scale(.8) rotate(${spin}deg)`, opacity: 0 }
      ], { duration: 800 + Math.random() * 500, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" })
        .onfinish = () => p.remove();
    }
  }

  /* ---- swap sweet <-> spicy with a flourish ---- */
  const stamp = document.querySelector(".stamp");
  let spicy = false, switching = false, taps = 0, tapTimer;
  function swapScraps() {
    switching = true;
    spicy = !spicy;

    /* stamp zaps, heart glows hotter in spicy mode, paper bursts out */
    stamp.classList.remove("zap");
    void stamp.offsetWidth;                       /* restart the animation */
    stamp.classList.add("zap");
    stamp.classList.toggle("hot", spicy);
    const r = stamp.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);

    /* old scraps get swept off the bottom, one by one */
    const old = scraps;
    [...old.children].forEach((d, i) => {
      d.style.setProperty("--d", (i * 70) + "ms");
      d.style.setProperty("--dx", (Math.random() * 160 - 80).toFixed(0) + "px");
      d.style.setProperty("--dy", (200 + Math.random() * 80).toFixed(0) + "px");
      d.style.setProperty("--spin", (Math.random() * 90 - 45).toFixed(0) + "deg");
    });
    old.classList.add("leaving");
    setTimeout(() => old.remove(), 800);

    /* new scraps slap in right behind them */
    setTimeout(() => renderScraps(spicy ? SPICY : SWEET, true), 380);
    setTimeout(() => { switching = false; }, 1100);
  }

  /* ---- secret: tap the stamp 3 times ---- */
  stamp.addEventListener("click", () => {
    if (switching) return;
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => (taps = 0), 1200);   /* taps must be within ~1.2s of each other */
    if (taps >= 3) { taps = 0; swapScraps(); }
  });

  /* ---- ransom-note letters ---- */
  const styles = [
    { f: "'Playfair Display', serif", bg: "#f3e6d3", c: "#120a10" },
    { f: "'Abril Fatface', serif",    bg: "#120a10", c: "#f3e6d3", b: "1px solid #e9a3bd" },
    { f: "'Old Standard TT', serif",  bg: "#e9a3bd", c: "#3a0d1c" },
    { f: "'Special Elite', monospace",bg: "#f3e6d3", c: "#c8325a" },
    { f: "'Playfair Display', serif", bg: "#c8325a", c: "#fff2f5" },
    { f: "'Abril Fatface', serif",    bg: "#ecd3b4", c: "#5a1230" },
  ];
  document.querySelectorAll("[data-ransom]").forEach((el, row) => {
    let i = 0;
    el.dataset.ransom.split(" ").forEach(word => {
      const w = document.createElement("span");
      w.className = "word";
      [...word].forEach(ch => {
        const s = document.createElement("span");
        s.className = "l";
        const st = styles[(i * 5 + row * 3 + ch.charCodeAt(0)) % styles.length];
        s.textContent = ch;
        s.style.cssText = `font-family:${st.f};background:${st.bg};color:${st.c};${st.b ? "border:" + st.b : ""};` +
          `transform:rotate(${((i * 7 + row * 4) % 9) - 4}deg) translateY(${((i * 5) % 7) - 3}px)`;
        w.appendChild(s);
        i++;
      });
      i++;
      el.appendChild(w);
    });
  });

  /* ---- No button runs away ---- */
  const caseEl = document.getElementById("case");
  const no = document.getElementById("no");
  const yes = document.getElementById("yes");
  function dodge(e) {
    if (e) e.preventDefault();
    const c = caseEl.getBoundingClientRect(), b = no.getBoundingClientRect();
    no.classList.add("fly");
    const minX = Math.max(c.left + 12, 8), maxX = Math.min(c.right, innerWidth) - b.width - 12;
    const minY = Math.max(c.top + 120, 8), maxY = Math.min(c.bottom, innerHeight) - b.height - 12;
    no.style.left = minX + Math.random() * Math.max(maxX - minX, 0) + "px";
    no.style.top = minY + Math.random() * Math.max(maxY - minY, 0) + "px";
    no.style.transform = `rotate(${Math.random() * 16 - 8}deg)`;
  }
  no.addEventListener("pointerenter", dodge);
  no.addEventListener("touchstart", dodge, { passive: false });
  no.addEventListener("click", dodge);

  /* ---- Yes: torn-paper confetti ---- */
  yes.addEventListener("click", () => {
    caseEl.classList.add("done");
    no.style.display = "none";
    for (let i = 0; i < 60; i++) {
      const b = document.createElement("div");
      b.className = "bit";
      const w = 8 + Math.random() * 14;
      b.style.cssText = `left:${Math.random() * 100}vw;width:${w}px;height:${w * (0.6 + Math.random() * 0.8)}px;` +
        `background:${BITS[i % BITS.length]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * 0.8}s;` +
        `clip-path:polygon(0 8%,40% 0,100% 12%,92% 100%,50% 88%,6% 100%)`;
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 6500);
    }
  });
</script>
</body>
</html>
