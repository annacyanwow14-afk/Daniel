<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daniel, do you love me?</title>

<!-- home screen app -->
<script>try { if (localStorage.getItem("dd-light") === "1") document.documentElement.classList.add("light"); } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#161b10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="For Daniel" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Cutive+Mono&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Vintage Garden palette: mostly green, a little brown, a little pink */
    --ink: #161b10;        /* deep green background */
    --paper: #E6D2B9;      /* sand */
    --blush: #E5BBC4;      /* pink */
    --rose: #A0646F;       /* mauve */
    --espresso: #5E3724;   /* dark brown text */
    --sage: #DDE1B5;
    --meadow: #C5CA81;
    --olive: #94975F;
    --moss: #7C6C46;
    --glass: rgba(221, 225, 181, 0.5);
    /* things that change between dark and light mode */
    --text: #E6D2B9;
    --card: rgba(24, 30, 17, .72);
    --rule: rgba(221, 225, 181, .07);
    --margin: rgba(229, 187, 196, .2);
    --grid: rgba(221, 225, 181, .055);
    --card-shadow: 0 0 0 6px rgba(221,225,181,.08), 0 30px 80px rgba(0,0,0,.6), inset 0 0 40px rgba(197,202,129,.12);
    --tape: rgba(230, 210, 185, .78);
    --perf: #161b10;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* light mode: same palette, flipped (tap "for Daniel") */
  :root.light {
    --text: #5E3724;
    --card: rgba(250, 246, 232, .82);
    --rule: rgba(124, 108, 70, .12);
    --margin: rgba(201, 80, 111, .2);
    --grid: rgba(124, 108, 70, .13);
    --glass: rgba(148, 151, 95, .75);
    --card-shadow: 0 0 0 6px rgba(148,151,95,.16), 0 24px 60px rgba(94,55,36,.28), inset 0 0 40px rgba(197,202,129,.28);
    --tape: rgba(197, 202, 129, .78);
    --perf: #F5F2DE;
  }
  :root.light .stamp { filter: drop-shadow(0 3px 4px rgba(94,55,36,.28)); }
  :root.light .tag { box-shadow: 0 2px 4px rgba(94,55,36,.25); }
  :root.light .ref.a { background: #E0C9AA; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, #2b3320 0%, var(--ink) 65%);
    font-family: "Special Elite", "Courier New", monospace;
    color: var(--text);
    overflow-x: hidden;
  }
  /* light backdrop (sage stripes), fades in over the dark one */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .5s ease;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.55), transparent 60%),
      repeating-linear-gradient(90deg, #E6EAC6 0 22px, #EEF1D8 22px 44px);
  }
  :root.light body::before { opacity: 1; }
  :root.light body::after { opacity: .2; }
  /* keeps the phone's status bar area dark in light mode (home-screen app) */
  .statusfill { display: none; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--ink); z-index: 100; pointer-events: none; }
  :root.light .statusfill { display: block; }

  /* circular reveal when switching modes */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) { z-index: 2; }
  /* film grain */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* jewel-case frame */
  .case {
    position: relative; width: min(94vw, 470px); margin: 24px 0;
    padding: 44px 26px 34px; min-height: 710px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    border: 2px solid var(--glass); border-radius: 12px;
    background: var(--card);
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }
  /* paper: plain, lined notebook or graph paper (one is picked each time the page opens) */
  .case.paper-lined {
    background:
      linear-gradient(90deg, transparent 56px, var(--margin) 56px, var(--margin) 58px, transparent 58px),
      repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px),
      var(--card);
  }
  .case.paper-graph {
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 22px 22px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 22px 22px,
      var(--card);
  }
  .case::before { /* hinge ticks */
    content: ""; position: absolute; left: 10px; top: 14px; bottom: 14px; width: 6px;
    background: repeating-linear-gradient(to bottom, var(--glass) 0 2px, transparent 2px 14px); opacity: .6;
  }

  /* collage pieces */
  .piece { position: absolute; }
  .stamp {
    top: 14px; right: 14px; width: 108px; height: 128px; transform: rotate(5deg); z-index: 5;
    background: #ECC8CF; padding: 12px 10px; color: var(--espresso); text-align: center;
    font-size: 11px; line-height: 1.1;
  }
  .stamp { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .stamp::before { content: ""; position: absolute; inset: 0; border: 6px dotted var(--perf); }
  .stamp path { transition: fill .4s ease; }
  .stamp svg { transition: filter .4s ease; }
  .stamp.hot path { fill: #C9506F; }
  .stamp.hot svg { filter: drop-shadow(0 0 6px rgba(201,80,111,.85)); }
  .stamp.zap { animation: stampZap .65s ease; }
  @keyframes stampZap {
    0%   { transform: rotate(5deg) scale(1); }
    20%  { transform: rotate(-8deg) scale(1.2); }
    40%  { transform: rotate(12deg) scale(1.12); }
    60%  { transform: rotate(-4deg) scale(1.15); }
    100% { transform: rotate(5deg) scale(1); }
  }
  .stamp svg { width: 40px; height: 40px; display: block; margin: 4px auto 8px; }
  .stamp-msg { font-size: 13px; line-height: 1.3; font-weight: 700; }
  .tag {
    cursor: pointer; z-index: 5; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    left: 22px; top: 22px; background: var(--paper); color: var(--ink); padding: 6px 12px;
    font-size: 12px; transform: rotate(-6deg); border-radius: 2px;
  }

  /* subtle paper grain on the cut-out pieces */
  .l, .ref, .stamp, .tag { --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .22  0 0 0 0 .14  0 0 0 .6 -.14'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"); }
  .l::after, .ref::after, .stamp::after, .tag::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; background-image: var(--grain); opacity: .5;
  }
  .ref.c::after { opacity: .25; }
  .l { position: relative; }

  /* tape */
  .tape {
    position: absolute; width: 54px; height: 17px; z-index: 7; pointer-events: none;
    background: var(--tape);
    clip-path: polygon(0 0, 4% 15%, 0 30%, 4% 45%, 0 60%, 4% 75%, 0 100%, 100% 100%, 96% 85%, 100% 70%, 96% 55%, 100% 40%, 96% 25%, 100% 10%, 100% 0);
  }
  .ref.c::before { content: ""; position: absolute; left: 50%; top: -9px; width: 46px; height: 16px; margin-left: -23px; transform: rotate(4deg);
    background: var(--tape); }

  /* ransom-note headline */
  .stage { position: relative; z-index: 2; text-align: center; margin-top: 112px; }
  .line { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin-bottom: 10px; }
  .word { display: inline-flex; gap: 3px; white-space: nowrap; }
  .line.big { margin-bottom: 14px; }
  .l {
    display: inline-block; padding: 2px 8px 0; line-height: 1.15;
    font-size: 38px; box-shadow: 2px 3px 6px rgba(0,0,0,.45);
  }
  .line.big .l { font-size: 52px; padding: 2px 10px 0; }
  .l.sp { background: none !important; box-shadow: none; width: 14px; padding: 0; }

  /* buttons */
  .buttons { position: relative; height: 96px; margin-top: 26px; z-index: 3; }
  button {
    position: absolute; top: 18px; border: none; cursor: pointer;
    font-family: "Special Elite", monospace; font-size: 18px; padding: 12px 30px;
    transition: transform .2s ease; box-shadow: 3px 5px 10px rgba(0,0,0,.5);
  }
  button:focus-visible { outline: 2px solid var(--blush); outline-offset: 4px; }
  #yes { left: 14%; background: var(--rose); color: #f7f1e3; transform: rotate(-3deg); }
  #yes:hover { transform: rotate(-1deg) scale(1.06); }
  #no { left: 56%; background: var(--paper); color: var(--espresso); transform: rotate(3deg); z-index: 20; transition: left .25s ease, top .25s ease, transform .2s; }
  #no.fly { position: fixed; }


  /* little postage scraps (phrases live in SWEET / SPICY below; positions are randomized in JS) */
  .refs { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 230px; z-index: 1; pointer-events: none; }
  .ref { position: absolute; width: clamp(118px, 34%, 165px); padding: 12px 12px 14px; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; transform: rotate(var(--r, 0deg)); box-shadow: 2px 4px 8px rgba(0,0,0,.5);
    pointer-events: auto; cursor: pointer; transition: transform .25s cubic-bezier(.2, 1.4, .4, 1), box-shadow .25s ease; }
  .ref:hover, .ref.up { z-index: 20 !important; transform: rotate(0deg) scale(1.12); box-shadow: 5px 12px 20px rgba(0,0,0,.65); }
  .ref.long { font-size: 10.5px; }
  .ref.a { background: var(--paper); color: var(--espresso);
    clip-path: polygon(0 4%, 8% 0, 20% 4%, 35% 0, 52% 4%, 70% 0, 86% 4%, 100% 1%, 99% 50%, 100% 97%, 82% 100%, 60% 96%, 40% 100%, 18% 96%, 0 100%, 1% 50%); }
  .ref.b { background: var(--blush); color: var(--espresso); border-radius: 2px; }
  .ref.b::before { content: ""; position: absolute; left: 50%; top: -9px; width: 46px; height: 16px; margin-left: -23px; background: var(--tape); transform: rotate(-3deg); }
  .ref.c { background: var(--ink); color: var(--paper); border: 1px solid var(--olive); }
  .done .refs { display: none; }

  /* scraps slap in, and get swept away on swap */
  .ref.in { animation: scrapIn .6s var(--d, 0ms) cubic-bezier(.2, 1.5, .4, 1) backwards; }
  @keyframes scrapIn {
    from { transform: translateY(80px) scale(.3) rotate(calc(var(--r, 0deg) + 35deg)); opacity: 0; }
    to   { transform: translateY(0) scale(1) rotate(var(--r, 0deg)); opacity: 1; }
  }
  .refs.leaving, .refs.leaving .ref { pointer-events: none; }
  .refs.leaving .ref { animation: scrapOut .5s var(--d, 0ms) cubic-bezier(.5, 0, .9, .4) forwards; }
  @keyframes scrapOut {
    to { transform: translate(var(--dx, 0px), var(--dy, 220px)) rotate(calc(var(--r, 0deg) + var(--spin, 40deg))) scale(.5); opacity: 0; }
  }

  /* burst bits from the stamp */
  .puff { position: fixed; pointer-events: none; z-index: 60; line-height: 1; }

  /* cutout pops up */
  .me { display: none; position: absolute; z-index: 4; left: 46%; bottom: -4px; width: auto; height: auto; max-height: 310px; max-width: 90%; transform: translateX(-50%); filter: drop-shadow(0 8px 14px rgba(0,0,0,.6)); }
  .done .me { display: block; animation: pop .7s .25s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes pop { from { transform: translate(-50%, 105%) rotate(-6deg); } to { transform: translate(-50%, 0) rotate(0); } }

  /* cat in the corner */
  .cat { display: none; position: absolute; z-index: 6; right: 10px; bottom: 10px; width: 92px; height: auto; transform: rotate(-4deg); filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .done .cat { display: block; animation: slap .45s .9s cubic-bezier(.2, 1.6, .4, 1) both; }

  /* reply state */
  .reply { display: none; position: relative; z-index: 5; text-align: center; margin-top: 112px; }
  .reply .note {
    display: inline-block; margin-top: 20px; padding: 12px 18px; background: var(--paper); color: var(--espresso);
    transform: rotate(-2deg); box-shadow: 3px 5px 10px rgba(0,0,0,.5); font-size: 15px;
  }
  .textme {
    display: none; position: absolute; left: 14px; bottom: 14px; z-index: 7;
    padding: 9px 20px; background: var(--paper); color: var(--espresso);
    font-family: 'Special Elite', 'Courier New', monospace; font-size: 17px; text-decoration: none;
    transform: rotate(-3deg); box-shadow: 3px 5px 10px rgba(0,0,0,.45);
    -webkit-tap-highlight-color: transparent;
  }
  .done .textme { display: block; animation: slap .45s 1.3s cubic-bezier(.2, 1.6, .4, 1) backwards; }
  .textme:active { transform: rotate(-3deg) scale(.96); }
  .reply .line { row-gap: 14px; }
  .reply .line:not(.big) { margin-top: 10px; }
  .done .stage, .done .buttons { display: none; }
  .done .reply { display: block; animation: slap .45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes slap { from { transform: scale(1.5) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* falling paper bits */
  /* petal + leaf confetti */
  .bit { position: fixed; top: -40px; pointer-events: none; z-index: 50; animation: fall linear forwards; opacity: .95; }
  .bit.petal { border-radius: 60% 0 60% 0; }
  .bit.leaf  { border-radius: 0 100% 0 100%; }
  @keyframes fall {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(var(--dx, 0px), 55vh) rotate(calc(var(--rot, 540deg) * .5)); }
    100% { transform: translate(calc(var(--dx, 0px) * -.6), 115vh) rotate(var(--rot, 540deg)); }
  }

  @media (max-width: 520px) {
    .l { font-size: 32px; } .line.big .l { font-size: 40px; padding: 2px 7px 0; }
    .stamp { width: 96px; height: 118px; } .stamp-msg { font-size: 11.5px; }
    .ref { font-size: 11px; padding: 9px 9px 11px; } .ref.long { font-size: 10px; }
    .refs { height: 215px; }
    .cat { width: 76px; }
    .textme { font-size: 15px; padding: 8px 16px; }
  }
  @media (max-width: 360px) { .l { font-size: 28px; } .line.big .l { font-size: 34px; padding: 2px 6px 0; } }
  /* smaller tiles for the longer lines on the Yes screen */
  .line.sm .l { font-size: 30px; padding: 2px 6px 0; }
  .line.xs .l { font-size: 26px; padding: 2px 5px 0; }
  @media (max-width: 520px) { .line.sm .l { font-size: 26px; } .line.xs .l { font-size: 23px; } }
  @media (max-width: 360px) { .line.sm .l { font-size: 23px; } .line.xs .l { font-size: 21px; } }
  @media (prefers-reduced-motion: reduce) { .bit, .puff { display: none; } .done .textme { animation: none; } .ref.in, .refs.leaving .ref, .stamp.zap { animation: none; } .done .reply, .done .me, .done .cat { animation: none; } }
</style>
</head>
<body>
  <div class="statusfill"></div>
  <main class="case" id="case">
    <div class="piece tag">for Daniel</div>

    <div class="piece stamp" aria-hidden="true">
      <span class="tape" style="top:-6px; left:-18px; transform:rotate(-38deg);"></span>
      <span class="tape" style="bottom:-4px; right:-18px; transform:rotate(-38deg);"></span>
      <svg viewBox="0 0 24 24"><path fill="#A0646F" d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></svg>
      <div class="stamp-msg" id="stampMsg">I miss you,<br>I'll see you soon</div>
    </div>

    <section class="stage">
      <div class="line" data-ransom="Daniel,"></div>
      <div class="line big" data-ransom="do you"></div>
      <div class="line big" data-ransom="love me?"></div>
    </section>

    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>

    <section class="reply" aria-live="polite">
      <div class="line big" data-ransom="WOOO"></div>
      <div class="line" id="replyLine" data-ransom="I love you too."></div>
    </section>

    <img class="me" alt="" src="me.webp" />
    <img class="cat" alt="" src="cat.gif" />
    <a class="textme" id="textMe" href="#">text me</a>
  </main>

<script>
  /* ---- edit these ---- */
  const BITS = ["#94975F", "#C5CA81", "#DDE1B5", "#E5BBC4", "#A0646F", "#E6D2B9", "#7C6C46"];


  /* ---- random photo (add more file names here) ---- */
  const PHOTOS = ["me.webp", "me2.webp", "me3.webp", "wink.webp", "glasses.webp", "tongue.webp", "warm.webp", "faire_cutout.webp", "earbuds.webp", "jacket.webp"];

  document.querySelector(".me").src = PHOTOS[Math.floor(Math.random() * PHOTOS.length)];

  /* ---- stamp message changes with the time of day (uses his device's clock) ---- */
  const STAMP_MSGS = {
    morning: ["good morning, handsome", "rise and shine, handsome"],      /* 5am - 11am */
    day:     ["I miss you, I'll see you soon", "thinking of you"],         /* 11am - 5pm */
    evening: ["hope your day was good", "good evening, handsome"],         /* 5pm - 10pm */
    night:   ["go to sleep, I love you", "goodnight, handsome"],           /* 10pm - 5am */
  };
  let spicy = false;                                   /* true after the secret triple-tap on the stamp */
  const STAMP_SPICY = ["wish you were here", "come over", "miss you... a lot", "I need you here"];
  const stampMsgEl = document.getElementById("stampMsg");
  let stampSlotNow = null;
  function updateStampMsg() {
    if (spicy) return;                               /* spicy mode keeps its own stamp message */
    const h = new Date().getHours();
    const slot = h >= 5 && h < 11 ? "morning" : h >= 11 && h < 17 ? "day" : h >= 17 && h < 22 ? "evening" : "night";
    if (slot === stampSlotNow) return;               /* same part of the day: leave it alone */
    stampSlotNow = slot;
    const list = STAMP_MSGS[slot];
    stampMsgEl.textContent = list[Math.floor(Math.random() * list.length)];
  }
  updateStampMsg();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) updateStampMsg(); });   /* app left open all day */

  /* ---- postage scraps: 3 random phrases from the active list each time ---- */
  const SWEET = [
    "I may not see you everyday but i love you everyday",
    "I will always be grateful to have you in my life",
    "your face is so kissable",
    "iloveyou iloveyou iloveyou",
    "thankyou for making me smile everyday",
  ];
  const SPICY = [
    "Pipe down handsome, you might get cracked.",
    "Congrats on your big penis!",
    "May I bounce on it, perchance.",
    "I'm not a waitress but ill take your tip",
    "dont be hard on yourself, be hard in me instead.",
    "calling me pretty gets you head btw",
  ];

  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  let scraps = null;
  function renderScraps(list, animate) {
    scraps = document.createElement("div");
    scraps.className = "refs";
    /* two scraps up top (left + right) and one lower in the middle, so none cover each other */
    const slots = shuffle([{ l: 2, b: 114 }, { l: 62, b: 118 }, { l: 32, b: 6 }]);
    const looks = shuffle(["a", "b", "c"]);      /* paper styles, shuffled */
    shuffle([...list]).slice(0, 3).forEach((text, i) => {
      const d = document.createElement("div");
      d.className = "ref " + looks[i] + (text.length > 42 ? " long" : "") + (animate ? " in" : "");
      d.textContent = text;
      d.style.left = slots[i].l + Math.random() * 4 - 2 + "%";
      d.style.bottom = slots[i].b + Math.random() * 10 + "px";
      d.style.setProperty("--r", (Math.random() * 12 - 6).toFixed(1) + "deg");
      d.style.setProperty("--d", (i * 90) + "ms");
      d.style.zIndex = 1 + Math.floor(Math.random() * 3);
      d.addEventListener("click", () => {        /* tap/click also brings a scrap to the front (for phones) */
        scraps.querySelectorAll(".up").forEach(x => { if (x !== d) x.classList.remove("up"); });
        d.classList.toggle("up");
      });
      scraps.appendChild(d);
    });
    document.getElementById("case").appendChild(scraps);
  }
  renderScraps(SWEET, false);

  /* ---- little burst of paper bits + hearts ---- */
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y) {
    if (reduceMotion) return;
    for (let i = 0; i < 24; i++) {
      const p = document.createElement("div");
      p.className = "puff";
      const color = BITS[i % BITS.length];
      if (i % 3 === 0) {
        p.textContent = "\u2665";
        p.style.color = color;
        p.style.fontSize = 14 + Math.random() * 12 + "px";
      } else {
        const w = 8 + Math.random() * 10;
        p.style.width = w + "px";
        p.style.height = w * (0.6 + Math.random() * 0.8) + "px";
        p.style.background = color;
        p.style.clipPath = "polygon(0 8%,40% 0,100% 12%,92% 100%,50% 88%,6% 100%)";
      }
      p.style.left = x + "px";
      p.style.top = y + "px";
      document.body.appendChild(p);
      const a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 120;
      const dx = Math.cos(a) * r, dy = Math.sin(a) * r;
      const spin = Math.random() * 540 - 270;
      p.animate([
        { transform: "translate(-50%,-50%) scale(.2) rotate(0deg)", opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${spin * 0.7}deg)`, opacity: 1, offset: 0.65 },
        { transform: `translate(calc(-50% + ${dx * 1.15}px), calc(-50% + ${dy * 1.15 + 40}px)) scale(.8) rotate(${spin}deg)`, opacity: 0 }
      ], { duration: 800 + Math.random() * 500, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" })
        .onfinish = () => p.remove();
    }
  }

  /* ---- swap sweet <-> spicy with a flourish ---- */
  const stamp = document.querySelector(".stamp");
  let switching = false, taps = 0, tapTimer;
  function swapScraps() {
    switching = true;
    spicy = !spicy;

    /* stamp zaps, heart glows hotter in spicy mode, paper bursts out */
    stamp.classList.remove("zap");
    void stamp.offsetWidth;                       /* restart the animation */
    stamp.classList.add("zap");
    stamp.classList.toggle("hot", spicy);
    if (spicy) stampMsgEl.textContent = STAMP_SPICY[Math.floor(Math.random() * STAMP_SPICY.length)];
    else { stampSlotNow = null; updateStampMsg(); }
    yes.textContent = spicy ? "Yes ;)" : "Yes";
    const r = stamp.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);

    /* old scraps get swept off the bottom, one by one */
    const old = scraps;
    [...old.children].forEach((d, i) => {
      d.style.setProperty("--d", (i * 70) + "ms");
      d.style.setProperty("--dx", (Math.random() * 160 - 80).toFixed(0) + "px");
      d.style.setProperty("--dy", (200 + Math.random() * 80).toFixed(0) + "px");
      d.style.setProperty("--spin", (Math.random() * 90 - 45).toFixed(0) + "deg");
    });
    old.classList.add("leaving");
    setTimeout(() => old.remove(), 800);

    /* new scraps slap in right behind them */
    setTimeout(() => renderScraps(spicy ? SPICY : SWEET, true), 380);
    setTimeout(() => { switching = false; }, 1100);
  }

  /* ---- secret: tap the stamp 3 times ---- */
  stamp.addEventListener("click", () => {
    if (switching) return;
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => (taps = 0), 1200);   /* taps must be within ~1.2s of each other */
    if (taps >= 3) { taps = 0; swapScraps(); }
  });

  /* ---- tap "for Daniel" to flip between dark and light mode ---- */
  const root = document.documentElement;
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  function setLight(on) {
    root.classList.toggle("light", on);
    if (themeMeta) themeMeta.setAttribute("content", on ? "#E9ECCB" : "#161b10");
    try { localStorage.setItem("dd-light", on ? "1" : "0"); } catch (e) {}
  }
  setLight(root.classList.contains("light"));       /* sync the status-bar colour with the saved mode */
  document.querySelector(".tag").addEventListener("click", () => {
    const next = !root.classList.contains("light");
    if (!document.startViewTransition || reduceMotion) { setLight(next); return; }
    const r = document.querySelector(".tag").getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    const t = document.startViewTransition(() => setLight(next));
    t.ready.then(() => {
      root.animate(
        { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
        { duration: 750, easing: "ease-in-out", pseudoElement: "::view-transition-new(root)" }
      );
    }).catch(() => {});
  });

  /* ---- ransom-note letters: typewriter fonts + palette colours, reshuffled every time the page opens ---- */
  const FONTS = [
    { f: "'Special Elite', 'Courier New', monospace", w: 400 },
    { f: "'Courier Prime', 'Courier New', monospace", w: 700 },
    { f: "'Cutive Mono', 'Courier New', monospace", w: 400 },
  ];
  /* [tile colours, how often it shows up]: mostly green, some pink, a little brown */
  const TILES = [
    [{ bg: "#DDE1B5", c: "#1f2614" }, 2],                                  /* sage */
    [{ bg: "#161b10", c: "#E6D2B9", b: "1px solid #94975F" }, 1],          /* deep green */
    [{ bg: "#94975F", c: "#f7f4e2" }, 2],                                  /* olive */
    [{ bg: "#C5CA81", c: "#2a3318" }, 2],                                  /* meadow */
    [{ bg: "#E5BBC4", c: "#5E3724" }, 2],                                  /* pink */
    [{ bg: "#E6D2B9", c: "#795138" }, 1],                                  /* sand + brown */
  ];
  const TILE_POOL = TILES.flatMap(([t, n]) => Array(n).fill(t));
  const pickRandom = arr => arr[Math.floor(Math.random() * arr.length)];
  /* paper for this visit: plain, lined or graph. To lock one in, replace the list with e.g. ["paper-plain"] */
  document.getElementById("case").classList.add(pickRandom(["paper-plain", "paper-lined", "paper-graph"]));
  function buildRansom(el) {
    el.textContent = "";
    el.classList.remove("sm", "xs");
    const len = (el.dataset.ransom || "").length;
    if (el.id === "replyLine") { if (len > 24) el.classList.add("xs"); else if (len > 16) el.classList.add("sm"); }
    let last = null;
    el.dataset.ransom.split(" ").forEach(word => {
      const w = document.createElement("span");
      w.className = "word";
      [...word].forEach(ch => {
        let t;
        do { t = pickRandom(TILE_POOL); } while (t === last);          /* no two neighbours the same colour */
        last = t;
        const ft = pickRandom(FONTS);
        const s = document.createElement("span");
        s.className = "l";
        s.textContent = ch;
        s.style.cssText = `font-family:${ft.f};font-weight:${ft.w};background:${t.bg};color:${t.c};${t.b ? "border:" + t.b + ";" : ""}` +
          `transform:translate(${(Math.random() * 6 - 3).toFixed(1)}px,${(Math.random() * 12 - 6).toFixed(1)}px) ` +
          `rotate(${(Math.random() * 14 - 7).toFixed(1)}deg) scale(${(0.94 + Math.random() * 0.12).toFixed(2)})`;
        w.appendChild(s);
      });
      el.appendChild(w);
    });
    /* each row also drifts and tilts a little on its own */
    el.style.transform = `translateX(${(Math.random() * 16 - 8).toFixed(1)}px) rotate(${(Math.random() * 3 - 1.5).toFixed(1)}deg)`;
  }
  document.querySelectorAll("[data-ransom]").forEach(buildRansom);

  /* ---- No button runs away ---- */
  const caseEl = document.getElementById("case");
  const no = document.getElementById("no");
  const yes = document.getElementById("yes");
  function dodge(e) {
    if (e) e.preventDefault();
    const c = caseEl.getBoundingClientRect(), b = no.getBoundingClientRect();
    no.classList.add("fly");
    const minX = Math.max(c.left + 12, 8), maxX = Math.min(c.right, innerWidth) - b.width - 12;
    const minY = Math.max(c.top + 120, 8), maxY = Math.min(c.bottom, innerHeight) - b.height - 12;
    no.style.left = minX + Math.random() * Math.max(maxX - minX, 0) + "px";
    no.style.top = minY + Math.random() * Math.max(maxY - minY, 0) + "px";
    no.style.transform = `rotate(${Math.random() * 16 - 8}deg)`;
  }
  no.addEventListener("pointerenter", dodge);
  no.addEventListener("touchstart", dodge, { passive: false });
  no.addEventListener("click", dodge);

  /* ---- Yes: torn-paper confetti ---- */
  /* ---- "text me" button: opens his Messages with a note to you already typed ---- */
  const TEXT_NUMBER = "+18062553105";
  document.getElementById("textMe").href = "sms:" + TEXT_NUMBER;

  /* ---- what the Yes screen says under "WOOO" (spicy mode gets its own set) ---- */
  const LOVE_SWEET = [
    "I love you too.", "I love you too, obviously.", "I love you too, handsome.",
    "I love you too, always.", "I love you too, duh.", "I love you more.",
  ];
  const LOVE_SPICY = ["come over here.", "I know you do.", "prove it.", "show me later."];
  const replyLine = document.getElementById("replyLine");

  yes.addEventListener("click", () => {
    replyLine.dataset.ransom = pickRandom(spicy ? LOVE_SPICY : LOVE_SWEET);
    buildRansom(replyLine);
    caseEl.classList.add("done");
    no.style.display = "none";
    const PETALS = ["#E5BBC4", "#ECC8CF", "#E5BBC4", "#F1D3D8", "#A0646F"];
    const LEAVES = ["#94975F", "#C5CA81", "#DDE1B5", "#7C8248"];
    for (let i = 0; i < 64; i++) {
      const leaf = i % 3 === 2;                       /* about a third leaves, the rest petals */
      const b = document.createElement("div");
      b.className = "bit " + (leaf ? "leaf" : "petal");
      const w = leaf ? 10 + Math.random() * 8 : 11 + Math.random() * 10;
      const color = leaf ? LEAVES[i % LEAVES.length] : PETALS[i % PETALS.length];
      b.style.cssText = `left:${Math.random() * 100}vw;width:${w}px;height:${w * (leaf ? 1.8 : 1.35)}px;background:${color};` +
        `animation-duration:${3.5 + Math.random() * 3}s;animation-delay:${Math.random() * 0.9}s;` +
        `--dx:${(Math.random() * 160 - 80).toFixed(0)}px;--rot:${(Math.random() * 720 - 360).toFixed(0)}deg;`;
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 8500);
    }
  });
</script>
</body>
</html>
