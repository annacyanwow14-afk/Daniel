<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daniel, do you love me?</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#a9c4ae" />
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Courier+Prime:wght@400;700&family=Old+Standard+TT:wght@700&family=Playfair+Display:wght@900&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #2f4a3c;
    --paper: #fbf6ee;
    --blush: #f2c4d0;
    --rose: #5d8a6a;
    --wine: #2f5240;
    --glass: rgba(111, 154, 122, 0.5);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 85% 90%, rgba(242,196,208,.55) 0%, transparent 45%),
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.7) 0%, transparent 50%),
      linear-gradient(160deg, #cfe0d3 0%, #a9c4ae 100%);
    font-family: "Special Elite", "Courier New", monospace;
    color: var(--ink);
    overflow-x: hidden;
  }
  /* film grain */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* jewel-case frame */
  .case {
    position: relative; width: min(94vw, 470px); margin: 24px 0;
    padding: 44px 26px 34px; min-height: 620px;
    border: 2px solid rgba(255,255,255,.85); border-radius: 12px;
    background:
      radial-gradient(circle at 50% 52%, transparent 0 34px, rgba(111,154,122,.18) 35px 36px, transparent 37px 120px, rgba(111,154,122,.13) 121px 122px, transparent 123px),
      rgba(248, 252, 246, .88);
    box-shadow: 0 0 0 6px rgba(255,255,255,.35), 0 30px 70px rgba(70,110,85,.35), inset 0 0 60px rgba(242,196,208,.28);
    overflow: hidden;
  }
  .case::before { /* hinge ticks */
    content: ""; position: absolute; left: 10px; top: 14px; bottom: 14px; width: 6px;
    background: repeating-linear-gradient(to bottom, rgba(93,138,106,.7) 0 2px, transparent 2px 14px); opacity: .6;
  }

  /* collage pieces */
  .piece { position: absolute; }
  .stamp {
    top: 14px; right: 14px; width: 108px; height: 128px; transform: rotate(5deg);
    background: var(--blush); padding: 12px 10px; color: var(--wine); text-align: center;
    font-size: 11px; line-height: 1.1;
  }
  .stamp::before { content: ""; position: absolute; inset: 0; border: 6px dotted #fbf6ee; }
  .stamp svg { width: 40px; height: 40px; display: block; margin: 4px auto 8px; }
  .stamp-msg { font-size: 13px; line-height: 1.3; font-weight: 700; }
  .tag {
    left: 22px; top: 22px; background: var(--paper); color: var(--ink); padding: 6px 12px;
    font-size: 12px; transform: rotate(-6deg); border-radius: 2px;
  }

  /* ransom-note headline */
  .stage { position: relative; z-index: 2; text-align: center; margin-top: 64px; }
  .line { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin-bottom: 10px; }
  .word { display: inline-flex; gap: 3px; white-space: nowrap; }
  .line.big { margin-bottom: 14px; }
  .l {
    display: inline-block; padding: 2px 8px 0; line-height: 1.15;
    font-size: 38px; box-shadow: 2px 3px 6px rgba(47,82,64,.28);
  }
  .line.big .l { font-size: 52px; padding: 2px 10px 0; }
  .l.sp { background: none !important; box-shadow: none; width: 14px; padding: 0; }

  /* buttons */
  .buttons { position: relative; height: 96px; margin-top: 26px; z-index: 3; }
  button {
    position: absolute; top: 18px; border: none; cursor: pointer;
    font-family: "Special Elite", monospace; font-size: 18px; padding: 12px 30px;
    transition: transform .2s ease; box-shadow: 3px 5px 10px rgba(47,82,64,.3);
  }
  button:focus-visible { outline: 2px solid var(--blush); outline-offset: 4px; }
  #yes { left: 14%; background: var(--rose); color: #fbf6ee; transform: rotate(-3deg); }
  #yes:hover { transform: rotate(-1deg) scale(1.06); }
  #no { left: 56%; background: var(--paper); color: #6a7f72; transform: rotate(3deg); z-index: 20; transition: left .25s ease, top .25s ease, transform .2s; }
  #no.fly { position: fixed; }

  .hint { position: relative; z-index: 3; margin-top: 8px; text-align: center; font-size: 13px; color: #c0667f; opacity: .95; }

  /* little postage scraps (phrases live in PHRASES below; positions are randomized in JS) */
  .refs { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 170px; z-index: 1; pointer-events: none; }
  .ref { position: absolute; width: clamp(118px, 36%, 170px); padding: 12px 12px 14px; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; transform: rotate(var(--r, 0deg)); box-shadow: 2px 4px 8px rgba(47,82,64,.28);
    pointer-events: auto; cursor: pointer; transition: transform .25s cubic-bezier(.2, 1.4, .4, 1), box-shadow .25s ease; }
  .ref:hover, .ref.up { z-index: 20 !important; transform: rotate(0deg) scale(1.12); box-shadow: 5px 12px 20px rgba(47,82,64,.4); }
  .ref.long { font-size: 10.5px; }
  .ref.a { background: #f4e2d2; color: #5d4332;
    clip-path: polygon(0 4%, 8% 0, 20% 4%, 35% 0, 52% 4%, 70% 0, 86% 4%, 100% 1%, 99% 50%, 100% 97%, 82% 100%, 60% 96%, 40% 100%, 18% 96%, 0 100%, 1% 50%); }
  .ref.b { background: var(--blush); color: #5a2f3d; border-radius: 2px; }
  .ref.b::before { content: ""; position: absolute; left: 50%; top: -9px; width: 46px; height: 16px; margin-left: -23px; background: rgba(255,255,255,.65); transform: rotate(-3deg); }
  .ref.c { background: #5d8a6a; color: #fbf6ee; border: 1px solid var(--blush); }
  .done .refs { display: none; }

  /* cutout pops up */
  .me { display: none; position: absolute; z-index: 4; left: 46%; bottom: -4px; width: auto; height: auto; max-height: 310px; max-width: 90%; transform: translateX(-50%); filter: drop-shadow(0 8px 14px rgba(47,82,64,.4)); }
  .done .me { display: block; animation: pop .7s .25s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes pop { from { transform: translate(-50%, 105%) rotate(-6deg); } to { transform: translate(-50%, 0) rotate(0); } }

  /* cat in the corner */
  .cat { display: none; position: absolute; z-index: 6; right: 10px; bottom: 10px; width: 92px; height: auto; transform: rotate(-4deg); filter: drop-shadow(0 4px 8px rgba(47,82,64,.35)); }
  .done .cat { display: block; animation: slap .45s .9s cubic-bezier(.2, 1.6, .4, 1) both; }

  /* reply state */
  .reply { display: none; position: relative; z-index: 5; text-align: center; margin-top: 56px; }
  .reply .note {
    display: inline-block; margin-top: 20px; padding: 12px 18px; background: var(--paper); color: var(--wine);
    transform: rotate(-2deg); box-shadow: 3px 5px 10px rgba(47,82,64,.3); font-size: 15px;
  }
  .done .stage, .done .buttons, .done .hint { display: none; }
  .done .reply { display: block; animation: slap .45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes slap { from { transform: scale(1.5) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* falling paper bits */
  .bit { position: fixed; top: -40px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

  @media (max-width: 420px) {
    .l { font-size: 32px; } .line.big .l { font-size: 44px; }
    .stamp { width: 96px; height: 118px; } .stamp-msg { font-size: 11.5px; }
    .ref { font-size: 10px; padding: 9px 9px 11px; } .ref.long { font-size: 9.5px; }
    .refs { height: 160px; }
    .cat { width: 76px; }
  }
  @media (prefers-reduced-motion: reduce) { .bit { display: none; } .done .reply, .done .me, .done .cat { animation: none; } }
</style>
</head>
<body>
  <main class="case" id="case">
    <div class="piece tag">for Daniel</div>

    <div class="piece stamp" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="#d9748f" d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></svg>
      <div class="stamp-msg">I miss you,<br>I'll see you soon</div>
    </div>

    <section class="stage">
      <div class="line" data-ransom="Daniel,"></div>
      <div class="line big" data-ransom="do you"></div>
      <div class="line big" data-ransom="love me?"></div>
    </section>

    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
    <p class="hint">no is currently out of order.</p>

    <section class="reply" aria-live="polite">
      <div class="line big" data-ransom="WOOO"></div>
      <div class="line" data-ransom="I love you too."></div>
    </section>

G3KjYMUcySMlU0fUdf2zbJaLIeGzkZw6je4AAAAA="];
  document.querySelector(".me").src = PHOTOS[Math.floor(Math.random() * PHOTOS.length)];

  /* ---- postage scraps: 3 random phrases from this list each time the page loads ---- */
  const PHRASES = [
    "Pipe down handsome, you might get cracked.",
    "Congrats on your big penis!",
    "May I bounce on it, perchance.",
    "I'm not a waitress but ill take your tip",
    "dont be hard on yourself, be hard in me instead.",
    "calling me pretty gets you head btw",
    "I may not see you everyday but i love you everyday",
    "I will always be grateful to have you in my life",
    "your face is so kissable",
    "iloveyou iloveyou iloveyou",
    "thankyou for making me smile everyday",
  ];
  const pool = [...PHRASES];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const scraps = document.createElement("div");
  scraps.className = "refs";
  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  const slots = shuffle([2, 33, 62]);          /* rough left positions (%), shuffled */
  const looks = shuffle(["a", "b", "c"]);      /* paper styles, shuffled */
  pool.slice(0, 3).forEach((text, i) => {
    const d = document.createElement("div");
    d.className = "ref " + looks[i] + (text.length > 42 ? " long" : "");
    d.textContent = text;
    d.style.left = Math.min(64, Math.max(0, slots[i] + Math.random() * 10 - 5)) + "%";
    d.style.bottom = 4 + Math.random() * 48 + "px";
    d.style.setProperty("--r", (Math.random() * 18 - 9).toFixed(1) + "deg");
    d.style.zIndex = 1 + Math.floor(Math.random() * 3);
    d.addEventListener("click", () => {          /* tap/click also brings a scrap to the front (for phones) */
      scraps.querySelectorAll(".up").forEach(x => { if (x !== d) x.classList.remove("up"); });
      d.classList.toggle("up");
    });
    scraps.appendChild(d);
  });
  document.getElementById("case").appendChild(scraps);

  /* ---- ransom-note letters ---- */
  const styles = [
    { f: "'Playfair Display', serif", bg: "#fbf6ee", c: "#3f6b52" },
    { f: "'Abril Fatface', serif",    bg: "#5d8a6a", c: "#fbf6ee" },
    { f: "'Old Standard TT', serif",  bg: "#f2c4d0", c: "#5a2f3d" },
    { f: "'Special Elite', monospace",bg: "#fbf6ee", c: "#d9748f" },
    { f: "'Playfair Display', serif", bg: "#8fb59b", c: "#fbf6ee" },
    { f: "'Abril Fatface', serif",    bg: "#e3eee4", c: "#2f5240", b: "1px solid #f2c4d0" },
  ];
  document.querySelectorAll("[data-ransom]").forEach((el, row) => {
    let i = 0;
    el.dataset.ransom.split(" ").forEach(word => {
      const w = document.createElement("span");
      w.className = "word";
      [...word].forEach(ch => {
        const s = document.createElement("span");
        s.className = "l";
        const st = styles[(i * 5 + row * 3 + ch.charCodeAt(0)) % styles.length];
        s.textContent = ch;
        s.style.cssText = `font-family:${st.f};background:${st.bg};color:${st.c};${st.b ? "border:" + st.b : ""};` +
          `transform:rotate(${((i * 7 + row * 4) % 9) - 4}deg) translateY(${((i * 5) % 7) - 3}px)`;
        w.appendChild(s);
        i++;
      });
      i++;
      el.appendChild(w);
    });
  });

  /* ---- No button runs away ---- */
  const caseEl = document.getElementById("case");
  const no = document.getElementById("no");
  const yes = document.getElementById("yes");
  function dodge(e) {
    if (e) e.preventDefault();
    const c = caseEl.getBoundingClientRect(), b = no.getBoundingClientRect();
    no.classList.add("fly");
    const minX = Math.max(c.left + 12, 8), maxX = Math.min(c.right, innerWidth) - b.width - 12;
    const minY = Math.max(c.top + 120, 8), maxY = Math.min(c.bottom, innerHeight) - b.height - 12;
    no.style.left = minX + Math.random() * Math.max(maxX - minX, 0) + "px";
    no.style.top = minY + Math.random() * Math.max(maxY - minY, 0) + "px";
    no.style.transform = `rotate(${Math.random() * 16 - 8}deg)`;
  }
  no.addEventListener("pointerenter", dodge);
  no.addEventListener("touchstart", dodge, { passive: false });
  no.addEventListener("click", dodge);

  /* ---- Yes: torn-paper confetti ---- */
  yes.addEventListener("click", () => {
    caseEl.classList.add("done");
    no.style.display = "none";
    for (let i = 0; i < 60; i++) {
      const b = document.createElement("div");
      b.className = "bit";
      const w = 8 + Math.random() * 14;
      b.style.cssText = `left:${Math.random() * 100}vw;width:${w}px;height:${w * (0.6 + Math.random() * 0.8)}px;` +
        `background:${BITS[i % BITS.length]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * 0.8}s;` +
        `clip-path:polygon(0 8%,40% 0,100% 12%,92% 100%,50% 88%,6% 100%)`;
      if (i % 2 === 0) { /* every other piece is a heart */
        b.textContent = "\u2665";
        b.style.cssText = `left:${Math.random() * 100}vw;font-size:${w * 1.7}px;line-height:1;color:${BITS[i % BITS.length]};` +
          `animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * 0.8}s`;
      }
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 6500);
    }
  });
